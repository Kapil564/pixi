name: Test Saira on clean Windows

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test-windows-install:
    runs-on: windows-latest
    timeout-minutes: 25

    env:
      NODE_VERSION: "20"
      PNPM_VERSION: "9"
      # Run without mic access — test launch + app shell, not voice capture
      SAIRA_TEST_MODE: "1"
      ELECTRON_ENABLE_LOGGING: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      # pnpm v10+ blocks native build scripts unless whitelisted
      - name: Configure pnpm build whitelist
        shell: pwsh
        run: |
          pnpm config set onlyBuiltDependencies 'better-sqlite3,electron,esbuild'

      - name: Install dependencies
        shell: pwsh
        run: |
          pnpm install --frozen-lockfile

      - name: Rebuild native modules for Electron
        shell: pwsh
        run: |
          pnpm rebuild

      - name: Build TypeScript and renderer assets
        shell: pwsh
        run: |
          pnpm build

      - name: Package Windows app (NSIS installer & portable exe)
        shell: pwsh
        run: |
          pnpm run pack

      - name: Locate generated executables
        shell: pwsh
        run: |
          $releaseDir = "release"
          if (-not (Test-Path $releaseDir)) {
            throw "Release directory '$releaseDir' was not generated!"
          }

          Get-ChildItem -Path $releaseDir | Format-Table Name, Length, LastWriteTime

          # Find the NSIS Setup installer
          $installer = Get-ChildItem -Path $releaseDir -Filter "*Setup*.exe" -File | Select-Object -First 1
          if (-not $installer) {
            $installer = Get-ChildItem -Path $releaseDir -Filter "*.exe" -File | Where-Object { $_.Name -match "Setup" -or $_.Name -match "installer" } | Select-Object -First 1
          }

          # Find the Portable standalone executable
          $portable = Get-ChildItem -Path $releaseDir -Filter "*.exe" -File | Where-Object { $_.Name -notmatch "Setup" -and $_.FullName -notmatch "win-unpacked" } | Select-Object -First 1

          if (-not $installer) { throw "NSIS Setup installer was not found in release/" }
          if (-not $portable) { throw "Portable executable was not found in release/" }

          Write-Host "Found NSIS Installer: $($installer.FullName) ($([math]::Round($installer.Length / 1MB, 2)) MB)"
          Write-Host "Found Portable App:    $($portable.FullName) ($([math]::Round($portable.Length / 1MB, 2)) MB)"

          "INSTALLER_PATH=$($installer.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "PORTABLE_PATH=$($portable.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Compute binary checksums (SHA-256)
        shell: pwsh
        run: |
          $installerHash = (Get-FileHash -Path $env:INSTALLER_PATH -Algorithm SHA256).Hash
          $portableHash  = (Get-FileHash -Path $env:PORTABLE_PATH -Algorithm SHA256).Hash
          Write-Host "Installer SHA-256: $installerHash"
          Write-Host "Portable SHA-256:  $portableHash"

      - name: Install Saira silently on clean Windows
        shell: pwsh
        run: |
          $installer = $env:INSTALLER_PATH
          $installDir = "$env:TEMP\SairaApp"
          Write-Host "Executing silent installation to '$installDir'..."

          # NSIS syntax requires /S and /D=<destination> as the last parameter without quotes
          $installProc = Start-Process -FilePath $installer -ArgumentList "/S", "/D=$installDir" -Wait -PassThru

          Write-Host "Installer process completed with exit code: $($installProc.ExitCode)"
          Start-Sleep -Seconds 3

          # Confirm installed application location
          $appExe = Join-Path $installDir "Saira.exe"
          if (-not (Test-Path $appExe)) {
            # Fallback to standard NSIS default user installation paths if /D was ignored
            $candidatePaths = @(
              "$env:LOCALAPPDATA\Programs\Saira\Saira.exe",
              "$env:LOCALAPPDATA\Programs\saira-assistant\Saira.exe",
              "$env:ProgramFiles\Saira\Saira.exe"
            )
            foreach ($candidate in $candidatePaths) {
              if (Test-Path $candidate) {
                $appExe = $candidate
                $installDir = Split-Path -Parent $candidate
                break
              }
            }
          }

          if (-not (Test-Path $appExe)) {
            throw "Silent installation failed: Saira.exe was not found at '$appExe'!"
          }

          Write-Host "Verified Saira installed successfully at: $appExe"
          "INSTALLED_APP_PATH=$appExe" | Out-File -FilePath $env:GITHUB_ENV -Append
          "INSTALL_DIR=$installDir" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Smoke test installed Saira application startup
        shell: pwsh
        run: |
          $appExe = $env:INSTALLED_APP_PATH
          Write-Host "Launching installed Saira: $appExe"

          # Launch with --hidden and --no-sandbox in headless CI environment
          $proc = Start-Process -FilePath $appExe -ArgumentList "--hidden", "--no-sandbox" -PassThru

          Write-Host "Process spawned with PID $($proc.Id). Waiting 15s to verify startup..."
          Start-Sleep -Seconds 15

          $isRunning = Get-Process -Id $proc.Id -ErrorAction SilentlyContinue
          if (-not $isRunning -or $proc.HasExited) {
            throw "Installed Saira process crashed or exited prematurely! ExitCode: $($proc.ExitCode)"
          }

          Write-Host "Process $($proc.Id) is running and stable. Stopping process..."
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2
          Write-Host "Installed application launch test PASSED."

      - name: Smoke test portable Saira executable startup
        shell: pwsh
        run: |
          $portableExe = $env:PORTABLE_PATH
          Write-Host "Launching portable Saira: $portableExe"

          $proc = Start-Process -FilePath $portableExe -ArgumentList "--hidden", "--no-sandbox" -PassThru

          Write-Host "Portable process spawned with PID $($proc.Id). Waiting 15s to verify startup..."
          Start-Sleep -Seconds 15

          $isRunning = Get-Process -Id $proc.Id -ErrorAction SilentlyContinue
          if (-not $isRunning -or $proc.HasExited) {
            throw "Portable Saira process crashed or exited prematurely! ExitCode: $($proc.ExitCode)"
          }

          Write-Host "Portable process $($proc.Id) is running and stable. Stopping process..."
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2
          Write-Host "Portable executable launch test PASSED."

      - name: Test silent uninstallation
        shell: pwsh
        run: |
          $installDir = $env:INSTALL_DIR
          $uninstaller = Get-ChildItem -Path $installDir -Filter "*Uninstall*.exe" -File | Select-Object -First 1
          if ($uninstaller) {
            Write-Host "Running uninstaller: $($uninstaller.FullName)"
            $uninstProc = Start-Process -FilePath $uninstaller.FullName -ArgumentList "/S" -Wait -PassThru
            Write-Host "Uninstaller exited with code: $($uninstProc.ExitCode)"
            Start-Sleep -Seconds 3
            Write-Host "Uninstallation test completed."
          } else {
            Write-Host "No uninstaller found at $installDir; skipping uninstallation test."
          }

      - name: Print diagnostic error logs (if any)
        if: always()
        shell: pwsh
        run: |
          $logFiles = @(
            "$env:APPDATA\Saira\err.txt",
            "err.txt",
            "saira-install.log"
          )
          foreach ($log in $logFiles) {
            if (Test-Path $log) {
              Write-Host "=== Diagnostic Log: $log ==="
              Get-Content $log
            }
          }

      - name: Upload Windows build artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: saira-windows-x64-release
          path: |
            release/*Setup*.exe
            release/*.exe
            !release/win-unpacked/**
          retention-days: 14