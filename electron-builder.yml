appId: com.kapil564.pixi
productName: pixi
copyright: Copyright © 2026
directories:
  output: release
files:
  - dist
  - drizzle
  - package.json
  - assets
  - index.html
asar: true
asarUnpack:
  - "**/*.node"
  - "**/node_modules/better-sqlite3/**/*"
  - "**/node_modules/bindings/**/*"
  - "**/node_modules/file-uri-to-path/**/*"
npmRebuild: false
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  icon: assets/icon.png
  publisherName: Kapil564
  verifyUpdateCodeSignature: false
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  runAfterFinish: true
