appId: com.kapil564.saira
productName: Saira
copyright: Copyright © 2026
directories:
  output: release
files:
  - dist
  - drizzle
  - package.json
  - assets
asar: true
asarUnpack:
  - "**/*.node"
npmRebuild: false
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  icon: assets/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  runAfterFinish: true
