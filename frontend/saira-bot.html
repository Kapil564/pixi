<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Saira — Interactive Voice Demo</title>
  <meta name="description" content="Experience Saira's state machine and voice interaction demo in your browser.">
  
  <!-- Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,500..600&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0b0a08;
      --bg-soft: #131210;
      --bg-card: #16140f;
      --rule: rgba(255, 255, 255, 0.09);
      --text: #f3ede2;
      --text-muted: #8f8878;
      --gold: #d99a4e;
      --gold-glow: rgba(217, 154, 78, 0.15);
      --sage: #6fae8c;
      --sage-glow: rgba(111, 174, 140, 0.15);
      --silver: #c7ccd6;
      --ember: #e2694a;
      
      --font-heading: 'Fraunces', Georgia, serif;
      --font-body: 'Inter', system-ui, -apple-system, sans-serif;
      --font-mono: 'IBM Plex Mono', monospace;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .container {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      padding: 0 1.5rem;
    }

    nav {
      padding: 1.25rem 0;
      border-bottom: 1px solid var(--rule);
      background: rgba(11, 10, 8, 0.85);
      backdrop-filter: blur(12px);
    }

    nav .container {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .back-link {
      font-family: var(--font-mono);
      font-size: 0.85rem;
      color: var(--text-muted);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      transition: color 0.2s;
    }

    .back-link:hover {
      color: var(--gold);
    }

    .brand-title {
      font-family: var(--font-heading);
      font-style: italic;
      font-size: 1.4rem;
      color: var(--text);
    }

    main {
      flex: 1;
      padding: 2.5rem 0 4rem;
      display: flex;
      flex-direction: column;
    }

    .demo-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
    }

    /* Orb & Status */
    .orb-stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
    }

    .orb-canvas {
      image-rendering: pixelated;
      width: 220px;
      height: 200px;
    }

    .state-badge {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 3px;
      padding: 0.35rem 1.25rem;
      border-radius: 999px;
      background: var(--bg-card);
      border: 1px solid var(--rule);
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      transition: all 0.3s ease;
    }

    .state-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--gold);
      box-shadow: 0 0 8px currentColor;
    }

    /* Controls & Mic */
    .mic-button-wrapper {
      position: relative;
    }

    .mic-btn {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: var(--bg-card);
      border: 2px solid var(--gold);
      color: var(--gold);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 20px var(--gold-glow);
    }

    .mic-btn:hover {
      transform: scale(1.06);
      background: var(--gold-glow);
    }

    .mic-btn.active {
      background: var(--sage);
      color: var(--bg);
      border-color: var(--sage);
      box-shadow: 0 0 30px var(--sage-glow);
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(111, 174, 140, 0.6); }
      70% { transform: scale(1.08); box-shadow: 0 0 0 16px rgba(111, 174, 140, 0); }
      100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(111, 174, 140, 0); }
    }

    .mic-icon {
      width: 32px;
      height: 32px;
      fill: currentColor;
    }

    /* Transcript Box */
    .chat-box {
      width: 100%;
      background-color: var(--bg-card);
      border: 1px solid var(--rule);
      border-radius: 18px;
      padding: 1.5rem;
      min-height: 240px;
      max-height: 360px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .chat-msg {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
      max-width: 85%;
    }

    .chat-msg.user {
      align-self: flex-end;
      align-items: flex-end;
    }

    .chat-msg.assistant {
      align-self: flex-start;
      align-items: flex-start;
    }

    .msg-sender {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--text-muted);
    }

    .msg-bubble {
      padding: 0.75rem 1.15rem;
      border-radius: 14px;
      font-size: 0.95rem;
      line-height: 1.5;
    }

    .chat-msg.user .msg-bubble {
      background-color: #242018;
      border: 1px solid rgba(217, 154, 78, 0.3);
      color: var(--text);
      border-bottom-right-radius: 4px;
    }

    .chat-msg.assistant .msg-bubble {
      background-color: var(--bg-soft);
      border: 1px solid var(--rule);
      color: var(--text);
      border-bottom-left-radius: 4px;
    }

    /* Text Form */
    .input-form {
      width: 100%;
      display: flex;
      gap: 0.75rem;
    }

    .text-input {
      flex: 1;
      background-color: var(--bg-card);
      border: 1px solid var(--rule);
      border-radius: 999px;
      padding: 0.85rem 1.5rem;
      color: var(--text);
      font-family: var(--font-body);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s ease;
    }

    .text-input:focus {
      border-color: var(--gold);
    }

    .send-btn {
      padding: 0.85rem 1.75rem;
      border-radius: 999px;
      background-color: var(--gold);
      color: var(--bg);
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .send-btn:hover {
      background-color: #e5a75c;
    }

    /* Preset Chips */
    .presets {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      justify-content: center;
      margin-top: -0.5rem;
    }

    .preset-chip {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      padding: 0.35rem 0.85rem;
      border-radius: 999px;
      background: var(--bg-soft);
      border: 1px solid var(--rule);
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s;
    }

    .preset-chip:hover {
      border-color: var(--gold);
      color: var(--gold);
    }
  </style>
</head>
<body>

  <nav>
    <div class="container">
      <a href="index.html" class="back-link">
        ← Back to About Saira
      </a>
      <span class="brand-title">Saira Interaction Demo</span>
    </div>
  </nav>

  <main>
    <div class="container demo-wrapper">

      <!-- Orb Mascot Canvas -->
      <div class="orb-stage">
        <canvas id="demoOrbCanvas" class="orb-canvas" width="220" height="200"></canvas>
        <div id="demoBadge" class="state-badge">
          <span id="demoDot" class="state-dot" style="background: var(--gold);"></span>
          <span id="demoStateText">IDLE</span>
        </div>
      </div>

      <!-- Microphone Activation Button -->
      <div class="mic-button-wrapper">
        <button id="micBtn" class="mic-btn" aria-label="Toggle Voice Recording">
          <svg class="mic-icon" viewBox="0 0 24 24">
            <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
            <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
          </svg>
        </button>
      </div>

      <!-- Preset Prompt Suggestions -->
      <div class="presets">
        <span class="preset-chip" onclick="sendPreset('What is your architecture?')">"What is your architecture?"</span>
        <span class="preset-chip" onclick="sendPreset('Can you run 100% offline?')">"Can you run 100% offline?"</span>
        <span class="preset-chip" onclick="sendPreset('What providers do you support?')">"What providers do you support?"</span>
      </div>

      <!-- Transcript Box -->
      <div id="chatBox" class="chat-box">
        <div class="chat-msg assistant">
          <span class="msg-sender">SAIRA</span>
          <div class="msg-bubble">
            Hello! I am Saira, your local-first Windows assistant. Click the microphone button or type a prompt below to see my state machine in action.
          </div>
        </div>
      </div>

      <!-- Text Input Form -->
      <form id="inputForm" class="input-form">
        <input type="text" id="textInput" class="text-input" placeholder="Type a message to Saira..." autocomplete="off">
        <button type="submit" class="send-btn">Send</button>
      </form>

    </div>
  </main>

  <script>
    // Canvas Orb Renderer
    function createOrb(canvas, options = {}) {
      const ctx = canvas.getContext('2d');
      const logicalW = 26;
      const logicalH = 24;
      let state = options.initialState || 'idle';
      let t = 0;
      let animationFrameId = null;

      const PALETTES = {
        idle: { body: '#e2e5e7', highlight: '#ffffff', blush: '#f2a4b0', outline: '#1e2028' },
        listening: { body: '#76d18c', highlight: '#a8f0b8', blush: '#e895a2', outline: '#1e2028' },
        thinking: { body: '#c7ccd6', highlight: '#ffffff', blush: '#b0b8c4', outline: '#1e2028' },
        speaking: { body: '#f6dfa9', highlight: '#fff5d6', blush: '#f0989e', outline: '#1e2028' }
      };

      function setState(newState) {
        if (PALETTES[newState]) state = newState;
      }

      function drawPixel(x, y, color) {
        const cellW = canvas.width / logicalW;
        const cellH = canvas.height / logicalH;
        ctx.fillStyle = color;
        ctx.fillRect(Math.floor(x * cellW), Math.floor(y * cellH), Math.ceil(cellW), Math.ceil(cellH));
      }

      function renderFrame() {
        t += 0.05;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const palette = PALETTES[state] || PALETTES.idle;

        // Body
        for (let x = 5; x <= 20; x++) {
          for (let y = 6; y <= 19; y++) {
            if ((x === 5 || x === 20) && (y === 6 || y === 19)) continue;
            drawPixel(x, y, palette.body);
          }
        }
        for (let y = 11; y <= 14; y++) {
          drawPixel(3, y, palette.body); drawPixel(4, y, palette.body);
          drawPixel(21, y, palette.body); drawPixel(22, y, palette.body);
        }

        // Outline
        for (let x = 6; x <= 19; x++) { drawPixel(x, 5, palette.outline); drawPixel(x, 20, palette.outline); }
        for (let y = 7; y <= 10; y++) { drawPixel(4, y, palette.outline); drawPixel(21, y, palette.outline); }
        for (let y = 15; y <= 18; y++) { drawPixel(4, y, palette.outline); drawPixel(21, y, palette.outline); }
        
        drawPixel(3, 10, palette.outline); drawPixel(2, 11, palette.outline); drawPixel(2, 12, palette.outline);
        drawPixel(2, 13, palette.outline); drawPixel(2, 14, palette.outline); drawPixel(3, 15, palette.outline);
        drawPixel(22, 10, palette.outline); drawPixel(23, 11, palette.outline); drawPixel(23, 12, palette.outline);
        drawPixel(23, 13, palette.outline); drawPixel(23, 14, palette.outline); drawPixel(22, 15, palette.outline);
        
        drawPixel(5, 6, palette.outline); drawPixel(20, 6, palette.outline);
        drawPixel(5, 19, palette.outline); drawPixel(20, 19, palette.outline);

        // Highlight & Blush
        for (let x = 7; x <= 10; x++) drawPixel(x, 7, palette.highlight);
        drawPixel(7, 8, palette.highlight);

        for (let x = 6; x <= 8; x++) { drawPixel(x, 14, palette.blush); drawPixel(x, 15, palette.blush); }
        for (let x = 17; x <= 19; x++) { drawPixel(x, 14, palette.blush); drawPixel(x, 15, palette.blush); }

        // States
        if (state === 'idle') {
          drawPixel(9, 11, palette.outline); drawPixel(10, 11, palette.outline); drawPixel(11, 11, palette.outline);
          drawPixel(14, 11, palette.outline); drawPixel(15, 11, palette.outline); drawPixel(16, 11, palette.outline);
          drawPixel(12, 14, palette.outline); drawPixel(13, 14, palette.outline);
          drawPixel(12, 15, palette.outline); drawPixel(13, 15, palette.outline);
        } else if (state === 'listening') {
          // Antennas
          drawPixel(8, 4, palette.outline); drawPixel(8, 3, palette.outline); drawPixel(7, 2, palette.outline);
          drawPixel(7, 1, '#5cbbf0'); drawPixel(6, 1, palette.outline); drawPixel(8, 1, palette.outline); drawPixel(7, 0, palette.outline);

          drawPixel(17, 4, palette.outline); drawPixel(17, 3, palette.outline); drawPixel(18, 2, palette.outline);
          drawPixel(18, 1, '#5cbbf0'); drawPixel(17, 1, palette.outline); drawPixel(19, 1, palette.outline); drawPixel(18, 0, palette.outline);

          const glint = Math.sin(t * 4) > 0 ? 1 : 0;
          drawOpenEye(9, 10, glint); drawOpenEye(15, 10, glint);
          drawPixel(12, 14, palette.outline); drawPixel(13, 14, palette.outline);
          drawPixel(11, 15, palette.outline); drawPixel(14, 15, palette.outline);
          drawPixel(12, 16, palette.outline); drawPixel(13, 16, palette.outline);
        } else if (state === 'thinking') {
          // Thinking spiral/dots
          drawOpenEye(9, 10, 0); drawOpenEye(15, 10, 0);
          drawPixel(12, 14, palette.outline); drawPixel(13, 14, palette.outline);
        } else if (state === 'speaking') {
          drawOpenEye(9, 10, 0); drawOpenEye(15, 10, 0);
          if (Math.sin(t * 12) > 0) {
            for (let x = 11; x <= 14; x++) {
              for (let y = 14; y <= 16; y++) drawPixel(x, y, palette.outline);
            }
            drawPixel(12, 15, '#e2694a'); drawPixel(13, 15, '#e2694a');
          } else {
            for (let x = 11; x <= 14; x++) drawPixel(x, 14, palette.outline);
          }
        }

        animationFrameId = requestAnimationFrame(renderFrame);
      }

      function drawOpenEye(startX, startY, glintXOffset) {
        for (let x = startX; x < startX + 3; x++) {
          for (let y = startY; y < startY + 3; y++) drawPixel(x, y, '#1e2028');
        }
        drawPixel(startX + glintXOffset, startY, '#ffffff');
      }

      function start() { if (!animationFrameId) renderFrame(); }
      start();

      return { setState };
    }

    // Demo App State Machine
    document.addEventListener('DOMContentLoaded', () => {
      const canvas = document.getElementById('demoOrbCanvas');
      const orb = createOrb(canvas, { initialState: 'idle' });
      const demoDot = document.getElementById('demoDot');
      const demoStateText = document.getElementById('demoStateText');
      const micBtn = document.getElementById('micBtn');
      const chatBox = document.getElementById('chatBox');
      const inputForm = document.getElementById('inputForm');
      const textInput = document.getElementById('textInput');

      let currentState = 'idle';

      function updateState(newState) {
        currentState = newState;
        orb.setState(newState);
        demoStateText.textContent = newState.toUpperCase();
        
        const colors = {
          idle: '#d99a4e',
          listening: '#6fae8c',
          thinking: '#c7ccd6',
          speaking: '#e2694a'
        };
        demoDot.style.background = colors[newState];
        demoDot.style.boxShadow = `0 0 8px ${colors[newState]}`;

        if (newState === 'listening') {
          micBtn.classList.add('active');
        } else {
          micBtn.classList.remove('active');
        }
      }

      function addMessage(sender, text) {
        const msgDiv = document.createElement('div');
        msgDiv.className = `chat-msg ${sender}`;
        
        const senderSpan = document.createElement('span');
        senderSpan.className = 'msg-sender';
        senderSpan.textContent = sender === 'user' ? 'YOU' : 'SAIRA';

        const bubbleDiv = document.createElement('div');
        bubbleDiv.className = 'msg-bubble';
        bubbleDiv.textContent = text;

        msgDiv.appendChild(senderSpan);
        msgDiv.appendChild(bubbleDiv);
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
      }

      function processQuery(query) {
        addMessage('user', query);
        updateState('thinking');

        setTimeout(() => {
          updateState('speaking');
          let responseText = "I process prompts locally using your chosen LLM and TTS provider pipeline.";
          const q = query.toLowerCase();

          if (q.includes('architecture')) {
            responseText = "Saira is built with Electron (Main Tray Process), React, TypeScript, and a Node.js orchestrator with pluggable STT/LLM/TTS stages.";
          } else if (q.includes('offline')) {
            responseText = "Yes! Saira supports 100% offline local execution using faster-whisper, local Ollama models, and Windows SAPI5 / Piper TTS.";
          } else if (q.includes('provider')) {
            responseText = "Supported providers include STT (OpenAI/Groq Whisper, local faster-whisper), LLM (GPT-4o-mini, Gemini, Groq Llama, Ollama), and TTS (Fish, ElevenLabs, Azure, SAPI5).";
          }

          addMessage('assistant', responseText);

          // Web Speech Synthesis if available
          if ('speechSynthesis' in window) {
            const utterance = new SpeechSynthesisUtterance(responseText);
            utterance.onend = () => updateState('idle');
            speechSynthesis.speak(utterance);
          } else {
            setTimeout(() => updateState('idle'), 3000);
          }
        }, 1200);
      }

      // Mic Button Web Speech API Handling
      let recognition = null;
      if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        recognition = new SpeechRecognition();
        recognition.continuous = false;
        recognition.interimResults = false;

        recognition.onstart = () => updateState('listening');
        recognition.onresult = (event) => {
          const transcript = event.results[0][0].transcript;
          processQuery(transcript);
        };
        recognition.onerror = () => updateState('idle');
        recognition.onend = () => {
          if (currentState === 'listening') updateState('idle');
        };
      }

      micBtn.addEventListener('click', () => {
        if (currentState === 'listening') {
          if (recognition) recognition.stop();
          updateState('idle');
        } else {
          if (recognition) {
            recognition.start();
          } else {
            // Fallback for browsers without speech recognition API
            updateState('listening');
            setTimeout(() => {
              processQuery("Simulated voice input: Tell me about Saira's offline capabilities.");
            }, 2000);
          }
        }
      });

      // Text Input Form Handling
      inputForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const text = textInput.value.trim();
        if (text) {
          textInput.value = '';
          processQuery(text);
        }
      });

      window.sendPreset = function(text) {
        processQuery(text);
      };
    });
  </script>
</body>
</html>
